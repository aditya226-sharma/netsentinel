# NetSentinel Default Configuration
# ================================

capture:
  interface: ""  # Auto-detect or specify, e.g. "eth0", "wlan0"
  bpf_filter: ""  # Berkeley Packet Filter, e.g. "tcp port 80"
  packet_limit: 0  # 0 = unlimited
  snap_length: 65535  # Bytes per packet to capture

database:
  path: "data/netsentinel.db"
  wal_mode: true  # Write-Ahead Logging for concurrent access

api:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

auth:
  enabled: true
  secret_key: ""  # Auto-generated if empty on first run
  algorithm: "HS256"
  token_expire_minutes: 60
  username: "admin"
  password_hash: ""  # Auto-generated bcrypt hash if empty on first run

dashboard:
  refresh_interval: 5  # Seconds between dashboard data refreshes
  theme: "dark"  # "dark" or "light"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/netsentinel.log"
  max_size: 10485760  # 10 MB
  backup_count: 5

alerts:
  enabled: true
  rules:
    - name: "High Bandwidth Usage"
      condition: "bytes_per_sec > 10485760"
      severity: "warning"
      message: "Bandwidth usage exceeds 10 MB/s"
    - name: "New Device Detected"
      condition: "new_device == true"
      severity: "info"
      message: "A new device was detected on the network"
    - name: "Port Scan Detected"
      condition: "unique_dst_ports > 20"
      severity: "critical"
      message: "Possible port scan detected from {{source_ip}}"
    - name: "DNS Tunneling Suspicion"
      condition: "dns_query_length > 50"
      severity: "warning"
      message: "Suspiciously long DNS query detected from {{source_ip}}"
    - name: "TLS Certificate Anomaly"
      condition: "cert_expiring_soon == true"
      severity: "info"
      message: "TLS certificate expiring soon for {{sni}}"

plugins:
  enabled: true
  directory: "plugins"

reports:
  output_dir: "reports/output"
  formats:
    - "pdf"
    - "html"
    - "json"
